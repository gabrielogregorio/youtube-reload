# Refuses versions published less than 3 days ago, including transitive ones.
minimumReleaseAge: 4320
minimumReleaseAgeExclude: []

engineStrict: true

# pnpm blocks install scripts by default; only these may run.
onlyBuiltDependencies:
  - cypress
  - esbuild

# Security overrides. Keep the reason next to each one and drop it once the parent updates.
overrides:
  # GHSA-g7r4-m6w7-qqqr: pulled by tsx through the Vite and Vitest optional dependencies
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  # GHSA-3g3m-2fjr-6pw4: pulled by workbox-build and the Cucumber preprocessor
  glob@>=9.0.0 <=14.0.1: ^14.0.2
