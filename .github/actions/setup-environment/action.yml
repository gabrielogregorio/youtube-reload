name: 'Setup Environment'
description: 'Sets up pnpm from packageManager and Node from .nvmrc, then installs the locked packages and, optionally, the Cypress binary'
inputs:
  e2e:
    description: 'Also install the Cypress binary'
    default: 'false'
runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Install the locked packages
      shell: bash
      env:
        CYPRESS_INSTALL_BINARY: ${{ inputs.e2e == 'true' && '' || '0' }}
      run: pnpm install --frozen-lockfile

    - name: Check the Cypress binary
      if: ${{ inputs.e2e == 'true' }}
      shell: bash
      run: pnpm exec cypress verify
