name: Tests Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests (100% coverage)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment

      - name: Run unit tests with coverage thresholds
        run: pnpm run unit:coverage

  e2e:
    name: E2E Tests (Cypress, axe, Lighthouse and resource usage)
    needs: unit
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment
        with:
          e2e: 'true'

      - name: Run the production build against Cypress, Lighthouse and the resource monitor
        run: pnpm run e2e

      - name: Upload the failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            cypress/screenshots
            lighthouseReport.html
            resourceUsageReport.json
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, e2e]
    environment: sentry
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      VITE_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment

      - name: Build the app, the Storybook and the coverage report
        run: |
          pnpm run unit:coverage
          node scripts/write-env.mts
          pnpm run build
          cp build/index.html build/404.html
          pnpm run build-storybook
          cp -r storybook-static build/storybook
          cp -r coverage build/coverage

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          pnpm exec gh-pages -d build --add -u "github-actions-bot <support+actions@github.com>"
