name: Tests Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests (100% coverage)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment

      - name: Run unit tests with coverage thresholds
        run: pnpm run unit:coverage

  e2e:
    name: E2E Tests (Cypress, axe, Lighthouse and resource usage)
    needs: unit
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment
        with:
          e2e: 'true'

      - uses: ./.github/actions/build-app

      - name: Run the test build against Cypress, Lighthouse and the resource monitor
        run: pnpm run e2e:built

      - name: Open every story of the Storybook in a real browser, with axe
        run: pnpm run e2e:storybook

      - name: Upload the failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            cypress/screenshots
            lighthouseReport.html
            resourceUsageReport.json
          if-no-files-found: ignore
          retention-days: 14

  publish-coverage:
    name: Publish the coverage report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment

      - name: Generate the report
        run: pnpm run unit:coverage

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          pnpm exec gh-pages -d coverage -e coverage --add -u "github-actions-bot <support+actions@github.com>"
